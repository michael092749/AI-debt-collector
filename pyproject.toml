[project]
name = "voice-debt-collector"
version = "0.1.0"
description = "Voice debt-collection negotiation agent — the LLM talks, deterministic code decides."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "openai>=1.0",
    "python-dotenv>=1.2.2",
    "livekit-agents>=1.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-asyncio>=1.0",
]

[project.scripts]
collector-text = "collector.text_app:run"
collector-agreements = "collector.text_app:dump_agreements"
collector-voice = "collector.voice_app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not evals'"
# Strict rather than auto: an async test opts in with `@pytest.mark.asyncio`,
# the way LiveKit's own test framework docs write them. Most of this suite is
# synchronous and should stay that way.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "evals: exercises tests/evals; makes live Anthropic calls when ANTHROPIC_API_KEY is set (VOICE_QUICKSTART.md). Run explicitly with `pytest -m evals tests/evals`.",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/collector"]
